<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>霓虹波纹动画</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        overflow: hidden;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .scene {
        position: relative;
        width: min(100vw, 1100px);
        aspect-ratio: 16 / 9;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .tip {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        color: #77fff0;
        opacity: 0.55;
        letter-spacing: 0.06em;
        font-size: 12px;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <canvas id="wave"></canvas>
    </div>
    <div class="tip">Neon Wave • Canvas</div>

    <script>
      const canvas = document.getElementById("wave");
      const ctx = canvas.getContext("2d");

      const DPR = () => Math.max(1, Math.min(2, window.devicePixelRatio || 1));

      const state = {
        width: 0,
        height: 0,
        particles: [],
      };

      function resize() {
        const ratio = DPR();
        const { width, height } = canvas.getBoundingClientRect();
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        state.width = width;
        state.height = height;

        state.particles = Array.from({ length: 24 }, () => ({
          x: Math.random() * width,
          y: height * 0.42 + Math.random() * height * 0.2,
          r: Math.random() * 1.8 + 0.2,
          speed: Math.random() * 0.08 + 0.03,
          drift: (Math.random() - 0.5) * 0.14,
          alpha: Math.random() * 0.5 + 0.2,
        }));
      }

      function drawBackgroundGlow(t) {
        const cx = state.width / 2;
        const cy = state.height / 2;

        const radiusX = state.width * 0.42;
        const radiusY = state.height * 0.22;

        const gradient = ctx.createRadialGradient(
          cx,
          cy,
          0,
          cx,
          cy,
          Math.max(radiusX, radiusY)
        );

        gradient.addColorStop(0, `rgba(0, 255, 210, ${0.2 + 0.04 * Math.sin(t)})`);
        gradient.addColorStop(0.45, "rgba(0, 180, 255, 0.08)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(cx, cy, radiusX, radiusY, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawWaveLayer({
        t,
        amp,
        freq,
        speed,
        phase,
        widthScale,
        alpha,
        color,
        blur,
      }) {
        const cx = state.width / 2;
        const cy = state.height / 2;
        const drawWidth = state.width * widthScale;
        const left = cx - drawWidth / 2;
        const right = cx + drawWidth / 2;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = color;

        ctx.beginPath();
        for (let x = left; x <= right; x += 2) {
          const n = (x - left) / drawWidth;
          const envelope = Math.pow(Math.sin(Math.PI * n), 1.85);
          const y =
            cy +
            amp * envelope * Math.sin(n * freq * Math.PI * 2 + t * speed + phase);

          if (x === left) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.stroke();
        ctx.restore();
      }

      function drawParticles(t) {
        ctx.save();
        ctx.globalCompositeOperation = "screen";

        state.particles.forEach((p) => {
          p.y -= p.speed;
          p.x += p.drift * Math.sin(t + p.y * 0.01);

          if (p.y < state.height * 0.18) {
            p.y = state.height * 0.75 + Math.random() * state.height * 0.2;
            p.x = Math.random() * state.width;
          }

          const twinkle = 0.35 + 0.65 * Math.sin(t * 1.5 + p.x * 0.01);

          ctx.beginPath();
          ctx.fillStyle = `rgba(130, 220, 255, ${p.alpha * twinkle})`;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      function render(time) {
        const t = time * 0.001;

        ctx.clearRect(0, 0, state.width, state.height);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, state.width, state.height);

        drawBackgroundGlow(t);

        drawWaveLayer({
          t,
          amp: state.height * 0.11,
          freq: 1.6,
          speed: 1.4,
          phase: 0,
          widthScale: 0.94,
          alpha: 0.18,
          color: "#3ef7df",
          blur: 24,
        });

        drawWaveLayer({
          t,
          amp: state.height * 0.085,
          freq: 2.4,
          speed: 2,
          phase: 1.2,
          widthScale: 0.87,
          alpha: 0.46,
          color: "#37f6da",
          blur: 16,
        });

        drawWaveLayer({
          t,
          amp: state.height * 0.06,
          freq: 3.2,
          speed: 2.5,
          phase: 2.1,
          widthScale: 0.76,
          alpha: 0.78,
          color: "#54ffe2",
          blur: 10,
        });

        drawParticles(t);

        requestAnimationFrame(render);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(render);
    </script>
  </body>
</html>
